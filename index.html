<title>Luisterkampioen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: één rustige kolom met grote tikvlakken. Drie niveaus, elk met eigen kleur: groen, blauw, paars. */
:root {
  --bg: #EAF2FF; --surface: #FFFFFF; --ink: #14213D; --muted: #4F5D7A; --line: #C7D6F0;
  --primary: #2F5FE0; --on-primary: #FFFFFF; --star: #F5A400; --star-off: #C7D6F0;
  --ok: #17804A; --ok-bg: #DDF4E6; --bad: #C23B30; --bad-bg: #FDE3E0; --hl: #FFE49A;
  --l1: #1F9D63; --l1-soft: #DDF4E8; --l2: #2F5FE0; --l2-soft: #DFE8FF; --l3: #7A4FE0; --l3-soft: #EAE2FF;
  --l4: #B45309; --l4-soft: #FFE8D1; --l5: #0B7285; --l5-soft: #D3EFF4;
  --f-display: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
  --f-body: 'Andika', 'Atkinson Hyperlegible', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1930; --surface: #172643; --ink: #EAF1FF; --muted: #A9B8D6; --line: #2D4068;
    --primary: #7FA4FF; --on-primary: #0E1930; --star: #FFC531; --star-off: #2D4068;
    --ok: #55D69A; --ok-bg: #12382A; --bad: #FF8479; --bad-bg: #4A2022; --hl: #5A4A12;
    --l1: #4CD08A; --l1-soft: #12382A; --l2: #7FA4FF; --l2-soft: #1B2F5E; --l3: #B79BFF; --l3-soft: #2E2459;
    --l4: #FFB066; --l4-soft: #4A2E12; --l5: #5CD4E8; --l5-soft: #12404A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1930; --surface: #172643; --ink: #EAF1FF; --muted: #A9B8D6; --line: #2D4068;
  --primary: #7FA4FF; --on-primary: #0E1930; --star: #FFC531; --star-off: #2D4068;
  --ok: #55D69A; --ok-bg: #12382A; --bad: #FF8479; --bad-bg: #4A2022; --hl: #5A4A12;
  --l1: #4CD08A; --l1-soft: #12382A; --l2: #7FA4FF; --l2-soft: #1B2F5E; --l3: #B79BFF; --l3-soft: #2E2459;
  --l4: #FFB066; --l4-soft: #4A2E12; --l5: #5CD4E8; --l5-soft: #12404A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.5;
  padding-block: 12px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1, h2 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lv1 { --lc: var(--l1); --ls: var(--l1-soft); }
.lv2 { --lc: var(--l2); --ls: var(--l2-soft); }
.lv3 { --lc: var(--l3); --ls: var(--l3-soft); }
.lv4 { --lc: var(--l4); --ls: var(--l4-soft); }
.lv5 { --lc: var(--l5); --ls: var(--l5-soft); }

/* knoppen */
.btn {
  font: 600 1.1rem/1.2 var(--f-display); min-height: 56px; padding: 12px 22px; border-radius: 16px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.big { min-height: 76px; font-size: 1.4rem; width: 100%; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 1rem; }
.btn.icon { min-width: 48px; min-height: 48px; padding: 8px; font-size: 1.3rem; }
.btn:active, .opt:active, .card:active { transform: translateY(1px); }
.btn:focus-visible, .opt:focus-visible, .card:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--primary); outline-offset: 3px;
}

/* bovenbalk */
.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top .grow { flex: 1; min-width: 0; font: 600 1.1rem var(--f-display); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { flex: 1; font: 600 1.3rem var(--f-display); display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.pill { font: 600 1.1rem var(--f-display); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--ink); }
.pill b { color: var(--star); font-weight: 600; }

/* home */
.hello { font-size: clamp(1.8rem, 6vw, 2.5rem); }
.lead { color: var(--muted); max-width: 52ch; }
.levels { display: flex; flex-direction: column; gap: 14px; }
.card {
  display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
  background: var(--ls); color: var(--ink); border: 2px solid var(--ls); border-radius: 22px; padding: 16px; cursor: pointer; font: inherit;
}
.card .ic { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--lc); display: grid; place-items: center; font-size: 2rem; }
.card .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .nm { font: 600 1.35rem var(--f-display); }
.card .sb { color: var(--muted); font-size: 0.95rem; }
.card .pr { flex: none; font: 600 1rem var(--f-display); color: var(--ink); text-align: right; }
.foot { color: var(--muted); font-size: 0.9rem; }

/* verhalenlijst */
.stories { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.tile {
  background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; font: inherit; color: var(--ink);
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-width: 0;
}
.tile .pc { font-size: 2.6rem; line-height: 1; }
.tile .tt { font: 600 1.2rem var(--f-display); }
.stars { letter-spacing: 2px; font-size: 1.25rem; }
.stars .on { color: var(--star); }
.stars .off { color: var(--star-off); }

/* verhaal */
.storyhead { background: var(--ls); border-radius: 24px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.storyhead .pic { font-size: 4rem; line-height: 1.1; }
.banner { background: var(--hl); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 0.95rem; }
.player { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.status { color: var(--muted); text-align: center; min-height: 1.5em; }
.text { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; font-size: 1.3rem; line-height: 1.8; }
.sent { padding: 2px 3px; border-radius: 6px; transition: background 0.2s; }
.sent.now { background: var(--hl); }

/* vragen */
.prog { display: flex; align-items: center; gap: 8px; }
.prog .lbl { font: 600 1rem var(--f-display); color: var(--muted); margin-right: auto; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dot.cur { background: var(--primary); }
.dot.good { background: var(--ok); }
.dot.miss { background: var(--bad); }
.qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qcard .qt { font-size: 1.55rem; line-height: 1.35; font-weight: 700; }
.opts { display: grid; gap: 12px; }
.opts.pics { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
.opts.list { grid-template-columns: 1fr; }
.opt {
  position: relative; font: inherit; color: var(--ink); background: var(--surface); border: 3px solid var(--line); border-radius: 18px;
  cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; min-height: 68px; min-width: 0;
}
.opts.pics .opt { flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 18px 8px; }
.oe { font-size: 2.2rem; line-height: 1; }
.opts.pics .oe { font-size: 3.4rem; }
.ot { font-size: 1.25rem; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.mk { position: absolute; top: 6px; right: 10px; font: 700 1.4rem var(--f-display); }
.opts.list .mk { position: static; margin-left: auto; }
.opt.reading { border-color: var(--primary); background: var(--l2-soft); transform: scale(1.02); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .mk { color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); animation: shake 0.35s; }
.opt.bad .mk { color: var(--bad); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt:disabled:not(.ok):not(.bad) { opacity: 0.55; }
.fb { min-height: 1.6em; font: 600 1.25rem var(--f-display); text-align: center; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* resultaat */
.result { background: var(--ls); border-radius: 26px; padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.result .stars { font-size: 3.4rem; letter-spacing: 6px; }
.result h1 { font-size: 2rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* instellingen voor ouders */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 28, 0.6); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.panel {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 24px 24px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.panel label, .panel legend { font-weight: 700; }
.panel select { font: inherit; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-height: 48px; }
.panel fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.panel .chk { display: flex; gap: 10px; align-items: center; font-weight: 400; }
.panel .chk input { width: 24px; height: 24px; }
.muted { color: var(--muted); font-size: 0.95rem; }

/* eigen verhaaltjes */
.ed { display: flex; flex-direction: column; gap: 12px; }
.ed label { font-weight: 700; }
.ed input[type=text], .ed textarea, .panel input[type=password] {
  font: inherit; width: 100%; min-width: 0; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.ed textarea { min-height: 180px; line-height: 1.6; resize: vertical; }
.ed textarea#eprompt { min-height: 120px; font-size: 0.85rem; }
.qedit { background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.qh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.box { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.emsg { min-height: 1.5em; font-weight: 700; }
.emsg.bad { color: var(--bad); }
.emsg.ok { color: var(--ok); }
.tilewrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tilewrap .tile { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .opt.bad { animation: none; }
  .opt.reading { transform: none; }
  .sent { transition: none; }
}
</style>

</head>

  /* ---------- Opslag (per toestel) ---------- */
  var KEY = 'luisterkampioen.v1';
  var mem = { stars: {}, settings: {}, custom: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw); mem.stars = d.stars || {}; mem.settings = d.settings || {}; mem.custom = d.custom || []; }
  } catch (e) { /* zonder opslag werkt de app gewoon verder */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* negeren */ } }
  var S = Object.assign({ speed: 'normal', showText: false, voice: '', apiKey: '' }, mem.settings);
  function saveSettings() { mem.settings = { speed: S.speed, showText: S.showText, voice: S.voice, apiKey: S.apiKey }; save(); }

  /* ---------- Voorlezen ---------- */
  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  var voices = [];
  var voicesChecked = false;
  function loadVoices() { try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
  loadVoices();
  if (synth) {
    if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', function () { loadVoices(); refreshBanner(); });
    setTimeout(function () { loadVoices(); voicesChecked = true; refreshBanner(); }, 1500);
  }
  function voiceState() {
    if (!synth) return 'none';
    if (voices.some(function (v) { return /^nl/i.test(v.lang); })) return 'ok';
    if (voices.length || voicesChecked) return 'nonl';
    return 'ok';
  }
  // Vlaamse stemmen (nl-BE) eerst, dan Nederlandse. Natuurlijke of online stemmen krijgen voorrang.
  function voiceScore(v) {
    var l = v.lang || '', s = 0;
    if (/^nl[-_]BE/i.test(l)) s += 100; else if (/^nl/i.test(l)) s += 50; else return -1;
    if (/natural|neural|online|enhanced|premium|siri/i.test(v.name || '')) s += 20;
    return s;
  }
  function rankedVoices() {
    return voices.map(function (v) { return { v: v, s: voiceScore(v) }; })
      .filter(function (x) { return x.s >= 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .map(function (x) { return x.v; });
  }
  function pickVoice() {
    if (S.voice) { var f = voices.find(function (v) { return v.voiceURI === S.voice; }); if (f) return f; }
    return rankedVoices()[0] || null;
  }
  function voiceStatusText() {
    var b = pickVoice();
    if (!b) return 'Geen Nederlandse stem gevonden. iPad: Instellingen, Toegankelijkheid, Gesproken inhoud, Stemmen, Nederlands, en download Ellen (België). Android: Instellingen, Tekst-naar-spraak, Google, en installeer Nederlands (België).';
    if (/^nl[-_]BE/i.test(b.lang)) return 'Vlaamse stem in gebruik: ' + b.name + '.';
    return 'Geen Vlaamse stem gevonden. Nu wordt een Nederlandse stem gebruikt (' + b.name + '). Voor een Vlaamse stem: iPad, Instellingen, Toegankelijkheid, Gesproken inhoud, Stemmen, Nederlands, Ellen (België). Android: installeer Nederlands (België) bij Google Tekst-naar-spraak. Windows met Edge: kies een Online (Natural) stem zoals Arnaud of Dena.';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function allStories() { return STORIES.concat(mem.custom); }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var runId = 0;
  function stopSpeech() { runId++; try { if (synth) synth.cancel(); } catch (e) { /* negeren */ } }

  function speak(text, rate) {
    return new Promise(function (res) {
      if (!synth) { res(); return; }
      var done = false, timer;
      function fin() { if (!done) { done = true; clearTimeout(timer); res(); } }
      try {
        var u = new SpeechSynthesisUtterance(text);
        var v = pickVoice();
        if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'nl-BE'; }
        u.rate = rate; u.pitch = 1.05;
        u.onend = fin; u.onerror = fin;
        timer = setTimeout(fin, 2500 + text.length * 170); // vangnet als een toestel geen einde meldt
        synth.speak(u);
      } catch (e) { fin(); }
    });
  }
  // Leest zin per zin voor. Geeft false terug als het onderbroken werd.
  async function readSentences(list, rate, onSent) {
    var my = ++runId;
    try { if (synth) synth.cancel(); } catch (e) { /* negeren */ }
    await sleep(120);
    if (my !== runId) return false;
    for (var i = 0; i < list.length; i++) {
      if (my !== runId) return false;
      if (onSent) onSent(i);
      await speak(list[i], rate);
      if (my !== runId) return false;
      await sleep(350);
    }
    if (onSent) onSent(-1);
    return my === runId;
  }

  /* ---------- Hulpfuncties ---------- */
  var $ = function (s) { return document.querySelector(s); };
  var app = document.getElementById('app');
  var view = { name: 'home' };
  function story() { return allStories().find(function (s) { return s.id === view.sid; }); }
  function level() { return LEVELS[view.lid - 1]; }
  function rate() { return level().rate * (S.speed === 'slow' ? 0.8 : 1); }
  function starsOf(id) { return mem.stars[id] || 0; }
  function totalStars() { return Object.keys(mem.stars).reduce(function (a, k) { return a + mem.stars[k]; }, 0); }
  function starsHTML(n, total) {
    total = total || 3; var h = '';
    for (var i = 1; i <= total; i++) h += '<span class="' + (i <= n ? 'on' : 'off') + '">★</span>';
    return '<span class="stars" role="img" aria-label="' + n + ' van ' + total + ' sterren">' + h + '</span>';
  }
  function shuffle(n) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  /* ---------- Schermen ---------- */
  function topbar(backLabel, title) {
    return '<header class="top">' +
      '<button class="btn small" data-act="back" aria-label="' + backLabel + '">← Terug</button>' +
      '<div class="grow">' + title + '</div>' +
      '<button class="btn small icon" data-act="settings" aria-label="Instellingen voor ouders">⚙</button></header>';
  }

  function homeHTML() {
    var cards = LEVELS.map(function (lv) {
      var list = allStories().filter(function (s) { return s.level === lv.id; });
      var got = list.reduce(function (a, s) { return a + starsOf(s.id); }, 0);
      return '<button class="card lv' + lv.id + '" data-act="level" data-id="' + lv.id + '">' +
        '<span class="ic" aria-hidden="true">' + lv.icon + '</span>' +
        '<span class="tx"><span class="nm">' + lv.name + '</span><span class="sb">' + lv.tag + '</span><span class="sb">' + lv.sub + '</span></span>' +
        '<span class="pr">' + (lv.custom ? list.length + (list.length === 1 ? ' verhaal' : ' verhalen') : '★ ' + got + '/' + list.length * 3) + '</span></button>';
    }).join('');
    return '<header class="top"><div class="brand"><span aria-hidden="true">🎧</span> Luisterkampioen</div>' +
      '<span class="pill" aria-label="' + totalStars() + ' sterren verdiend"><b>★</b> ' + totalStars() + '</span>' +
      '<button class="btn small icon" data-act="settings" aria-label="Instellingen voor ouders">⚙</button></header>' +
      '<h1 class="hello">Luister goed en verdien sterren!</h1>' +
      '<p class="lead">Kies een niveau. Je hoort eerst een verhaaltje. Daarna volgen een paar vragen.</p>' +
      '<div class="levels">' + cards + '</div>' +
      '<p class="foot">Ouders: stem, snelheid en de tekst bij het verhaal vind je onder ⚙.</p>';
  }

  function levelHTML() {
    var lv = level();
    var list = allStories().filter(function (s) { return s.level === lv.id; });
    var tiles = list.map(function (s) {
      var t = '<button class="tile" data-act="story" data-id="' + s.id + '">' +
        '<span class="pc" aria-hidden="true">' + s.pic + '</span><span class="tt">' + esc(s.title) + '</span>' + starsHTML(starsOf(s.id)) + '</button>';
      return lv.custom ? '<div class="tilewrap">' + t + '<button class="btn small" data-act="edit" data-id="' + s.id + '">✎ Aanpassen</button></div>' : t;
    }).join('');
    var extra = lv.custom ? '<button class="btn big primary" data-act="newstory">＋ Nieuw verhaaltje maken</button>' +
      (list.length ? '' : '<p class="lead">Je hebt nog geen eigen verhaaltjes. Typ of plak een tekst en maak er vragen bij.</p>') : '';
    return topbar('Terug naar het begin', lv.name + ' · ' + lv.tag) +
      '<div class="lv' + lv.id + '"><h1>' + (lv.custom ? 'Mijn verhaaltjes' : 'Kies een verhaaltje') + '</h1></div>' + extra +
      '<div class="stories lv' + lv.id + '">' + tiles + '</div>';
  }

  function bannerHTML() {
    var v = voiceState();
    if (v === 'none') return '<div class="banner">Dit toestel kan niet voorlezen. Een ouder kan de tekst hieronder voorlezen.</div>';
    if (v === 'nonl') return '<div class="banner">Er is geen Nederlandse stem gevonden op dit toestel. Kies een stem onder ⚙, of laat een ouder de tekst voorlezen.</div>';
    return '';
  }
  function refreshBanner() { var b = $('#banner'); if (b) b.innerHTML = bannerHTML(); }

  function storyHTML() {
    var st = story();
    var sents = st.s.map(function (z, i) { return '<span class="sent" data-i="' + i + '">' + esc(z) + '</span>'; }).join(' ');
    return topbar('Terug naar de verhaaltjes', level().name) +
      '<section class="storyhead lv' + st.level + '"><div class="pic" aria-hidden="true">' + st.pic + '</div><h1>' + esc(st.title) + '</h1></section>' +
      '<div id="banner">' + bannerHTML() + '</div>' +
      '<div class="player">' +
        '<button id="playbtn" class="btn big primary" data-act="play"></button>' +
        '<div class="row">' +
          '<button id="speedbtn" class="btn small" data-act="speed"></button>' +
          '<button id="textbtn" class="btn small" data-act="toggletext"></button>' +
        '</div>' +
        '<p id="status" class="status" role="status"></p>' +
      '</div>' +
      '<article id="text" class="text" ' + (view.showText ? '' : 'hidden') + '>' + sents + '</article>' +
      '<button id="toquiz" class="btn big" data-act="toquiz">Naar de vragen →</button>';
  }
  function paintStory() {
    var b = $('#playbtn'); if (!b) return;
    b.innerHTML = view.playing ? '<span aria-hidden="true">⏹</span> Stop' : '<span aria-hidden="true">▶</span> ' + (view.listened ? 'Nog eens luisteren' : 'Luister naar het verhaal');
    b.classList.toggle('primary', !view.listened || view.playing);
    $('#toquiz').classList.toggle('primary', !!view.listened && !view.playing);
    $('#speedbtn').innerHTML = S.speed === 'slow' ? '<span aria-hidden="true">🐢</span> Traag' : '<span aria-hidden="true">🐇</span> Gewoon';
    $('#speedbtn').setAttribute('aria-label', 'Voorleessnelheid: ' + (S.speed === 'slow' ? 'traag' : 'gewoon') + '. Tik om te wisselen.');
    $('#textbtn').innerHTML = view.showText ? 'Verberg de tekst' : 'Toon de tekst';
    $('#text').hidden = !view.showText;
    $('#status').textContent = view.playing ? 'Luister goed…' : (view.listened ? 'Heb je goed geluisterd? Beantwoord nu de vragen.' : 'Druk op de knop en luister naar het verhaal.');
    var sents = document.querySelectorAll('.sent');
    for (var i = 0; i < sents.length; i++) sents[i].classList.toggle('now', i === view.cur);
  }
  async function playStory() {
    var st = story(); var tok = ++view.tok;
    view.playing = true; view.cur = -1; paintStory();
    var ok = await readSentences(st.s, rate(), function (i) { if (view.tok === tok) { view.cur = i; paintStory(); } });
    if (view.tok !== tok) return;
    if (ok) view.listened = true;
    view.playing = false; view.cur = -1; paintStory();
  }

  /* ---------- Vragen ---------- */
  function optsHTML() {
    var q = story().q[view.qi];
    return view.order.map(function (idx) {
      var o = q.o[idx];
      var wrong = view.wrong.indexOf(idx) >= 0;
      var ok = view.locked && idx === 0;
      return '<button class="opt' + (wrong ? ' bad' : '') + (ok ? ' ok' : '') + '" data-act="answer" data-i="' + idx + '"' + ((wrong || view.locked) ? ' disabled' : '') + '>' +
        (o[0] ? '<span class="oe" aria-hidden="true">' + o[0] + '</span>' : '') + '<span class="ot">' + esc(o[1]) + '</span>' +
        '<span class="mk" aria-hidden="true">' + (ok ? '✓' : wrong ? '✗' : '') + '</span></button>';
    }).join('');
  }
  function quizHTML() {
    var st = story(), q = st.q[view.qi];
    var dots = st.q.map(function (_, i) {
      return '<span class="dot ' + (i < view.qi ? (view.res[i] ? 'good' : 'miss') : (i === view.qi ? 'cur' : '')) + '"></span>';
    }).join('');
    return topbar('Terug naar het verhaal', esc(st.title)) +
      '<div class="prog"><span class="lbl">Vraag ' + (view.qi + 1) + ' van ' + st.q.length + '</span>' + dots + '</div>' +
      '<section class="qcard"><p class="qt">' + esc(q.t) + '</p>' +
        '<button class="btn small" data-act="rehear"><span aria-hidden="true">🔊</span> Nog eens horen</button></section>' +
      '<div id="opts" class="opts ' + (st.level === 1 ? 'pics' : 'list') + '">' + optsHTML() + '</div>' +
      '<p id="fb" class="fb" role="status" aria-live="polite"></p>' +
      '<div id="nextwrap"></div>';
  }
  function setFb(text, kind) { var f = $('#fb'); if (f) { f.textContent = text; f.className = 'fb ' + (kind || ''); } }
  function paintOpts() { var o = $('#opts'); if (o) o.innerHTML = optsHTML(); }
  function showNext() {
    var last = view.qi === story().q.length - 1;
    $('#nextwrap').innerHTML = '<button class="btn big primary" data-act="next">' + (last ? 'Klaar! Bekijk je sterren' : 'Volgende vraag →') + '</button>';
  }
  function hl(idx, on) { var el = document.querySelector('.opt[data-i="' + idx + '"]'); if (el) el.classList.toggle('reading', on); }
  function clearHl() { document.querySelectorAll('.opt.reading').forEach(function (e) { e.classList.remove('reading'); }); }

  async function readQuestion() {
    var my = ++runId;
    try { if (synth) synth.cancel(); } catch (e) { /* negeren */ }
    clearHl();
    await sleep(150); if (my !== runId) return;
    var q = story().q[view.qi], r = rate(), order = view.order.slice(), skip = view.wrong.slice();
    await speak(q.t, r); if (my !== runId) return;
    await sleep(450);
    for (var n = 0; n < order.length; n++) {
      var idx = order[n];
      if (skip.indexOf(idx) >= 0) continue;
      if (my !== runId) return;
      hl(idx, true);
      await speak(q.o[idx][1], r);
      hl(idx, false);
      if (my !== runId) return;
      await sleep(300);
    }
    clearHl();
  }
  function newQuestion() {
    var q = story().q[view.qi];
    view.order = shuffle(q.o.length); view.tries = 0; view.wrong = []; view.locked = false;
  }
  function startQuiz() {
    go({ name: 'quiz', sid: view.sid, lid: view.lid, qi: 0, res: [], order: [], wrong: [], tries: 0, locked: false });
    newQuestion(); render(); readQuestion();
  }
  async function answer(idx) {
    if (view.locked || view.wrong.indexOf(idx) >= 0) return;
    stopSpeech(); clearHl();
    var st = story(), q = st.q[view.qi], r = rate();
    if (idx === 0) {
      view.locked = true; if (view.tries === 0) view.res[view.qi] = true; else view.res[view.qi] = false;
      paintOpts(); setFb('Goed zo!', 'ok'); showNext();
      readSentences(['Goed zo!'], r);
      return;
    }
    view.tries++; view.wrong.push(idx);
    if (view.tries === 1) {
      paintOpts(); setFb('Dat klopt niet. Luister nog eens.', 'bad');
      var ok = await readSentences(['Dat klopt niet. Luister nog eens.', st.s[q.src], 'Probeer het nog eens.'].filter(Boolean), r);
      if (ok) setFb('Probeer het nog eens.', '');
    } else {
      view.locked = true; view.res[view.qi] = false;
      paintOpts(); setFb('Het juiste antwoord is: ' + q.o[0][1], 'bad'); showNext();
      readSentences(['Dat klopt niet. Het juiste antwoord is: ' + q.o[0][1]], r);
    }
  }
  function finishQuiz() {
    var st = story(), n = st.q.length;
    var score = view.res.filter(Boolean).length;
    var stars = score === n ? 3 : (score >= Math.ceil(n / 2) ? 2 : 1);
    if (stars > starsOf(st.id)) { mem.stars[st.id] = stars; save(); }
    go({ name: 'result', sid: view.sid, lid: view.lid, score: score, n: n, stars: stars });
    var msg = stars === 3 ? 'Super! Je hebt alles goed!' : stars === 2 ? 'Goed gedaan!' : 'Mooi geprobeerd! Probeer het nog eens.';
    readSentences([msg], rate());
  }
  function resultHTML() {
    var st = story();
    var msg = view.stars === 3 ? 'Super! Alles goed!' : view.stars === 2 ? 'Goed gedaan!' : 'Mooi geprobeerd!';
    var sub = view.stars === 3 ? 'Je bent een echte luisterkampioen.' : 'Luister nog eens naar het verhaal en probeer opnieuw voor meer sterren.';
    var all = allStories(), idx = all.indexOf(st), nxt = all[idx + 1];
    var hasNext = nxt && nxt.level === st.level;
    return '<section class="result lv' + st.level + '"><div style="font-size:3.5rem" aria-hidden="true">' + st.pic + '</div>' +
      starsHTML(view.stars) + '<h1>' + msg + '</h1>' +
      '<p>' + view.score + ' van ' + view.n + ' vragen meteen juist.</p><p class="muted">' + sub + '</p></section>' +
      '<div class="stack">' +
        (hasNext ? '<button class="btn big primary" data-act="nextstory" data-id="' + nxt.id + '">Volgend verhaaltje →</button>' : '') +
        '<button class="btn big' + (hasNext ? '' : ' primary') + '" data-act="retry">Vragen opnieuw proberen</button>' +
        '<button class="btn big" data-act="back">Alle verhaaltjes</button>' +
      '</div>';
  }

  /* ---------- Eigen verhaaltjes ---------- */
  function words(s) { return String(s).toLowerCase().split(/[^a-zà-ÿ0-9]+/).filter(function (w) { return w.length >= 4; }); }
  function splitSentences(text) {
    var m = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]*["')»]*/g) || [];
    return m.map(function (z) { return z.trim(); }).filter(Boolean);
  }
  function blankQ() { return { t: '', a: '', w1: '', w2: '' }; }
  function isEmptyQ(q) { return !(q.t.trim() || q.a.trim() || q.w1.trim() || q.w2.trim()); }
  function guessSrc(sents, q) {
    var aw = words(q.a), qw = words(q.t), best = -1, bs = 0;
    sents.forEach(function (z, i) {
      var zw = words(z), sc = 0;
      aw.forEach(function (w) { if (zw.indexOf(w) >= 0) sc += 2; });
      qw.forEach(function (w) { if (zw.indexOf(w) >= 0) sc += 1; });
      if (sc > bs) { bs = sc; best = i; }
    });
    return best;
  }
  function fld(label, f, i, val) {
    var id = 'f-' + f + '-' + i;
    return '<label for="' + id + '">' + label + '</label><input type="text" id="' + id + '" data-f="' + f + '" data-i="' + i + '" value="' + esc(val) + '">';
  }
  function editHTML() {
    var qs = view.qs.map(function (q, i) {
      return '<section class="qedit"><div class="qh"><b>Vraag ' + (i + 1) + '</b><button class="btn small" data-act="delq" data-i="' + i + '">Verwijder</button></div>' +
        fld('Vraag', 't', i, q.t) + fld('Juist antwoord', 'a', i, q.a) + fld('Fout antwoord 1', 'w1', i, q.w1) + fld('Fout antwoord 2', 'w2', i, q.w2) + '</section>';
    }).join('');
    return topbar('Terug naar mijn verhaaltjes', 'Eigen verhaaltje') + '<div class="ed">' +
      '<h1>' + (view.sid ? 'Verhaaltje aanpassen' : 'Nieuw verhaaltje') + '</h1>' +
      '<label for="etitle">Titel</label><input type="text" id="etitle" value="' + esc(view.title) + '">' +
      '<label for="etext">Verhaal</label><textarea id="etext">' + esc(view.text) + '</textarea>' +
      '<p class="muted">Schrijf korte zinnen. De app leest elke zin apart voor. Na een fout antwoord herhaalt ze de zin waarin het antwoord staat.</p>' +
      '<div class="box"><h2>Vragen</h2>' + qs + '<button class="btn small" data-act="addq">＋ Vraag toevoegen</button></div>' +
      '<div class="box"><h2>Vragen laten maken door Claude</h2>' +
        (S.apiKey ? '<button class="btn" data-act="aigen">Maak vragen met Claude</button>' :
          '<p class="muted">Geen API-sleutel ingesteld (zie ⚙). Je kan ook de opdracht kopiëren, in een gesprek met Claude plakken en het antwoord hieronder terugplakken.</p>') +
        '<button class="btn" data-act="copyprompt">Kopieer opdracht voor Claude</button>' +
        '<textarea id="eprompt" readonly hidden aria-label="Opdracht voor Claude"></textarea>' +
        '<label for="epaste">Antwoord van Claude plakken</label><textarea id="epaste">' + esc(view.paste) + '</textarea>' +
        '<button class="btn" data-act="importjson">Vragen inlezen</button></div>' +
      '<p id="emsg" class="emsg" role="status"></p>' +
      '<button class="btn big primary" data-act="savestory">Bewaar verhaaltje</button>' +
      (view.sid ? '<div id="delwrap"><button class="btn small" data-act="delask">Verhaaltje verwijderen</button></div>' : '') +
      '</div>';
  }
  function msg(t, kind) { var m = $('#emsg'); if (m) { m.textContent = t; m.className = 'emsg ' + (kind || ''); } }
  function buildPrompt(title, text) {
    return 'Je helpt bij een oefenapp voor begrijpend luisteren voor kinderen van het eerste en tweede leerjaar in Vlaanderen.\n' +
      'Maak 4 meerkeuzevragen bij het verhaaltje hieronder.\n' +
      'Regels:\n- Het juiste antwoord staat letterlijk of duidelijk in het verhaal.\n' +
      '- Elke vraag heeft 1 juist en 2 foute antwoorden. De foute antwoorden zijn aannemelijk, maar volgens het verhaal duidelijk fout.\n' +
      '- Korte vragen en antwoorden in eenvoudig Vlaams Nederlands.\n' +
      '- Wissel af tussen wie, wat, waar en waarom. Stel minstens één vraag over het einde.\n' +
      'Antwoord enkel met JSON in dit formaat, zonder extra tekst:\n' +
      '[{"vraag":"...","juist":"...","fout":["...","..."]}]\n\n' +
      'Titel: ' + (title || '') + '\nVerhaal:\n' + text;
  }
  function applyQuestions(text) {
    var a = text.indexOf('['), b = text.lastIndexOf(']');
    if (a < 0 || b < a) throw new Error('Geen vragen gevonden in het antwoord');
    var arr = JSON.parse(text.slice(a, b + 1));
    var out = arr.map(function (x) {
      var f = x.fout || x.fouten || [];
      return { t: String(x.vraag || x.t || '').trim(), a: String(x.juist || x.a || '').trim(), w1: String(f[0] || '').trim(), w2: String(f[1] || '').trim() };
    }).filter(function (q) { return q.t && q.a && q.w1 && q.w2; });
    if (!out.length) throw new Error('De vragen waren niet volledig');
    view.qs = view.qs.filter(function (q) { return !isEmptyQ(q); }).concat(out);
    render();
    msg(out.length + ' vragen toegevoegd. Lees ze na en bewaar het verhaaltje.', 'ok');
  }
  async function aiGenerate() {
    var sents = splitSentences(view.text);
    if (!sents.length) { msg('Schrijf of plak eerst het verhaal.', 'bad'); return; }
    msg('Claude maakt de vragen…', '');
    try {
      var r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 1500, messages: [{ role: 'user', content: buildPrompt(view.title, view.text) }] })
      });
      if (!r.ok) throw new Error('foutcode ' + r.status);
      var d = await r.json();
      applyQuestions((d.content || []).map(function (c) { return c.text || ''; }).join(''));
    } catch (e) { msg('Het lukte niet (' + e.message + '). Controleer de sleutel en de internetverbinding.', 'bad'); }
  }
  function saveStory() {
    var title = view.title.trim(), sents = splitSentences(view.text), built = [];
    if (!title) { msg('Geef het verhaaltje een titel.', 'bad'); return; }
    if (!sents.length) { msg('Schrijf of plak eerst het verhaal.', 'bad'); return; }
    for (var i = 0; i < view.qs.length; i++) {
      var q = view.qs[i];
      if (isEmptyQ(q)) continue;
      if (!(q.t.trim() && q.a.trim() && q.w1.trim() && q.w2.trim())) { msg('Vraag ' + (i + 1) + ' is nog niet volledig. Vul de vraag en drie antwoorden in.', 'bad'); return; }
      built.push({ t: q.t.trim(), src: guessSrc(sents, q), o: [['', q.a.trim()], ['', q.w1.trim()], ['', q.w2.trim()]] });
    }
    if (!built.length) { msg('Voeg minstens één vraag toe.', 'bad'); return; }
    var obj = { id: view.sid || 'c' + Date.now(), level: 5, title: title, pic: '📖', s: sents, q: built };
    var at = mem.custom.findIndex(function (c) { return c.id === obj.id; });
    if (at >= 0) mem.custom[at] = obj; else mem.custom.push(obj);
    save();
    go({ name: 'level', lid: 5 });
  }

  /* ---------- Instellingen voor ouders ---------- */
  function sheetHTML() {
    var list = rankedVoices(); if (!list.length) list = voices;
    var opts = '<option value="">Automatisch (beste Vlaamse stem)</option>' + list.map(function (v) {
      return '<option value="' + esc(v.voiceURI) + '"' + (S.voice === v.voiceURI ? ' selected' : '') + '>' + (/^nl[-_]BE/i.test(v.lang) ? 'Vlaams · ' : '') + esc(v.name) + ' (' + esc(v.lang) + ')</option>';
    }).join('');
    return '<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sttl">' +
      '<h2 id="sttl">Instellingen voor ouders</h2>' +
      (synth ? '<div><label for="voicesel">Stem</label><select id="voicesel">' + opts + '</select></div>' +
        '<p class="muted" id="vstat">' + voiceStatusText() + '</p>' +
        '<button class="btn small" data-act="testvoice">🔊 Proefstem</button>' :
        '<p class="muted">Dit toestel kan niet voorlezen.</p>') +
      '<fieldset><legend>Snelheid</legend>' +
        '<label class="chk"><input type="radio" name="speed" value="slow"' + (S.speed === 'slow' ? ' checked' : '') + '> Traag</label>' +
        '<label class="chk"><input type="radio" name="speed" value="normal"' + (S.speed === 'normal' ? ' checked' : '') + '> Gewoon</label></fieldset>' +
      '<label class="chk"><input type="checkbox" id="showtext"' + (S.showText ? ' checked' : '') + '> De tekst van het verhaal standaard tonen</label>' +
      '<div><label for="apikey">Anthropic API-sleutel (optioneel)</label><input id="apikey" type="password" autocomplete="off" value="' + esc(S.apiKey) + '">' +
        '<p class="muted">Alleen nodig om bij eigen verhaaltjes automatisch vragen te laten maken. De sleutel blijft op dit toestel, in de opslag van de browser.</p></div>' +
      '<p class="muted">Sterren, eigen verhaaltjes en instellingen worden alleen op dit toestel bewaard.</p>' +
      '<div id="resetwrap"><button class="btn small" data-act="resetask">Alle sterren wissen</button></div>' +
      '<button class="btn primary" data-act="closesettings">Klaar</button></div></div>';
  }
  function openSettings() { loadVoices(); $('#sheetHost').innerHTML = sheetHTML(); var c = document.querySelector('.panel .btn.primary'); if (c) c.focus(); }
  function closeSettings() { $('#sheetHost').innerHTML = ''; stopSpeech(); }

  /* ---------- Navigatie ---------- */
  function render() {
    var h = '';
    if (view.name === 'home') h = homeHTML();
    else if (view.name === 'level') h = levelHTML();
    else if (view.name === 'story') h = storyHTML();
    else if (view.name === 'quiz') h = quizHTML();
    else if (view.name === 'result') h = resultHTML();
    else if (view.name === 'edit') h = editHTML();
    app.innerHTML = h;
    if (view.name === 'story') paintStory();
    if (view.name === 'quiz' && view.locked) showNext();
  }
  function go(v) { stopSpeech(); view = v; render(); window.scrollTo(0, 0); }
  function openStory(id) {
    var st = allStories().find(function (s) { return s.id === id; });
    go({ name: 'story', sid: id, lid: st.level, showText: S.showText || voiceState() !== 'ok', listened: false, playing: false, tok: 0, cur: -1 });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.getAttribute('data-act');
    switch (a) {
      case 'level': go({ name: 'level', lid: +el.getAttribute('data-id') }); break;
      case 'story': openStory(el.getAttribute('data-id')); break;
      case 'nextstory': openStory(el.getAttribute('data-id')); break;
      case 'back':
        if (view.name === 'level') go({ name: 'home' });
        else if (view.name === 'story') go({ name: 'level', lid: view.lid });
        else if (view.name === 'quiz') openStory(view.sid);
        else if (view.name === 'result') go({ name: 'level', lid: view.lid });
        else if (view.name === 'edit') go({ name: 'level', lid: 5 });
        break;
      case 'play': if (view.playing) { view.tok++; stopSpeech(); view.playing = false; view.cur = -1; paintStory(); } else playStory(); break;
      case 'speed': S.speed = S.speed === 'slow' ? 'normal' : 'slow'; saveSettings(); paintStory(); break;
      case 'toggletext': view.showText = !view.showText; paintStory(); break;
      case 'toquiz': case 'retry': startQuiz(); break;
      case 'answer': answer(+el.getAttribute('data-i')); break;
      case 'rehear': if (!view.locked) readQuestion(); break;
      case 'next':
        if (view.qi >= story().q.length - 1) finishQuiz();
        else { stopSpeech(); view.qi++; newQuestion(); render(); readQuestion(); window.scrollTo(0, 0); }
        break;
      case 'newstory': go({ name: 'edit', sid: null, title: '', text: '', qs: [blankQ()], paste: '' }); break;
      case 'edit':
        var c = mem.custom.find(function (x) { return x.id === el.getAttribute('data-id'); });
        if (c) go({ name: 'edit', sid: c.id, title: c.title, text: c.s.join(' '), paste: '',
          qs: c.q.map(function (q) { return { t: q.t, a: q.o[0][1], w1: q.o[1][1], w2: q.o[2][1] }; }) });
        break;
      case 'addq': view.qs.push(blankQ()); render(); break;
      case 'delq': view.qs.splice(+el.getAttribute('data-i'), 1); if (!view.qs.length) view.qs.push(blankQ()); render(); break;
      case 'savestory': saveStory(); break;
      case 'aigen': aiGenerate(); break;
      case 'importjson':
        try { applyQuestions(view.paste); } catch (err) { msg('Inlezen mislukt: ' + err.message + '.', 'bad'); }
        break;
      case 'copyprompt':
        var ta = $('#eprompt'); ta.value = buildPrompt(view.title, view.text);
        var okMsg = 'Opdracht gekopieerd. Plak ze in een gesprek met Claude en plak het antwoord hieronder terug.';
        var failMsg = function () { ta.hidden = false; ta.focus(); ta.select(); msg('Kopiëren lukte niet. Kopieer de opdracht hieronder zelf.', 'bad'); };
        try { navigator.clipboard.writeText(ta.value).then(function () { msg(okMsg, 'ok'); }, failMsg); } catch (err2) { failMsg(); }
        break;
      case 'delask':
        $('#delwrap').innerHTML = '<p class="muted">Zeker weten? Het verhaaltje verdwijnt.</p><div class="row"><button class="btn small" data-act="delyes">Ja, verwijderen</button><button class="btn small" data-act="delno">Nee</button></div>';
        break;
      case 'delno': $('#delwrap').innerHTML = '<button class="btn small" data-act="delask">Verhaaltje verwijderen</button>'; break;
      case 'delyes':
        mem.custom = mem.custom.filter(function (x) { return x.id !== view.sid; }); delete mem.stars[view.sid]; save();
        go({ name: 'level', lid: 5 });
        break;
      case 'settings': openSettings(); break;
      case 'closesettings': closeSettings(); if (view.name === 'home') render(); break;
      case 'testvoice': readSentences(['Dag! Ik lees de verhaaltjes voor.'], 0.8); break;
      case 'resetask':
        $('#resetwrap').innerHTML = '<p class="muted">Zeker weten? Alle sterren verdwijnen.</p><div class="row"><button class="btn small" data-act="resetyes">Ja, wissen</button><button class="btn small" data-act="resetno">Nee</button></div>';
        break;
      case 'resetyes': mem.stars = {}; save(); closeSettings(); render(); break;
      case 'resetno': $('#resetwrap').innerHTML = '<button class="btn small" data-act="resetask">Alle sterren wissen</button>'; break;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'voicesel') { S.voice = t.value; saveSettings(); }
    else if (t.name === 'speed') { S.speed = t.value; saveSettings(); }
    else if (t.id === 'showtext') { S.showText = t.checked; saveSettings(); }
    else if (t.id === 'apikey') { S.apiKey = t.value.trim(); saveSettings(); }
  });
  document.addEventListener('input', function (e) {
    if (view.name !== 'edit') return;
    var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
    if (t.id === 'etitle') view.title = t.value;
    else if (t.id === 'etext') view.text = t.value;
    else if (t.id === 'epaste') view.paste = t.value;
    else if (f) view.qs[+t.getAttribute('data-i')][f] = t.value;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#sheet')) closeSettings(); });

  render();
})();
</script>

</body>
</html>
